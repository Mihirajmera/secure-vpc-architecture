name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.0

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      # Pinned to a commit: a scanner pulled from a moving branch or tag can be swapped
      # for malicious code without any change to this file.
      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  compliance:
    name: IaC compliance evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Checkov (hash-pinned)
        run: pip install --require-hashes -r compliance/requirements.txt

      # Checkov exits non-zero on any failed check; the gate below decides using the
      # reviewed exceptions in compliance/exceptions.yaml.
      - name: Scan Terraform
        run: checkov -d . --framework terraform -o json --compact --skip-download --skip-path compliance > compliance/checkov.json || true

      - name: Evidence and gate (fails on findings without a reviewed exception)
        run: |
          python compliance/iac_evidence.py compliance/checkov.json
          cat compliance/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iac-compliance-evidence
          path: |
            compliance/report.md
            compliance/assessment-results.json
            compliance/checkov.json
